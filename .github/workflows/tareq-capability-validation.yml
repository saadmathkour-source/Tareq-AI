name: Tareq capability validation

on:
  pull_request:
    paths:
      - 'tareq/**'
      - '.github/workflows/tareq-capability-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tareq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tareq/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bounded analytical tests (no production secrets or database)
        run: node --test --experimental-strip-types tests/capability-execution.test.ts tests/capability-route.test.ts tests/capability-index.test.ts tests/capabilities.test.ts tests/commercial.test.ts
