name: Tareq capability validation

on:
  pull_request:
    paths:
      - 'tareq/**'
      - '.github/workflows/tareq-capability-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tareq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tareq/package-lock.json
      - name: Resolve security override for review
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit report (advisory names only)
        shell: bash
        run: |
          npm audit --json > /tmp/tareq-audit.json || true
          node -e 'const a=require("/tmp/tareq-audit.json"); for(const [k,v] of Object.entries(a.vulnerabilities||{})) console.log([k,v.severity,JSON.stringify(v.via),JSON.stringify(v.fixAvailable)].join(" | ")); console.log("AUDIT_COUNTS",JSON.stringify(a.metadata?.vulnerabilities||{}));'
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bounded analytical tests (no production secrets or database)
        run: node --test --experimental-strip-types tests/capability-execution.test.ts tests/capability-route.test.ts tests/capability-index.test.ts tests/capabilities.test.ts tests/commercial.test.ts
