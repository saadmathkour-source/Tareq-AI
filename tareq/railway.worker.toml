[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Background worker service: runs the durable task loop (`npm run worker`), which
# is what makes TAREQ work when no browser is open. Deploy this file by pointing
# a second Railway service's config file at `tareq/railway.worker.toml`.
# No health check: the worker has no HTTP port, so Railway supervises it by the
# process staying alive (restart on failure).
startCommand = "npm run worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
