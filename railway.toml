# TAREQ AI — production service configuration.
#
# IMPORTANT: The repository root also contains a legacy Next.js landing page
# ("VoiceProxy AI") that was previously what Railway built, which is why the
# production URL showed the wrong application. This file redirects the build to
# the real TAREQ application in `tareq/` via its Dockerfile.
#
# If Railway's "Root Directory" for this service is set to `tareq/` instead of
# the repository root, Railway will use `tareq/railway.toml` (Nixpacks) instead
# of this file; both are configured to build and run TAREQ, never VoiceProxy.
#
# `tareq/Dockerfile` is written to build under EITHER layout (context = repo root
# or context = `tareq/`), so the DOCKERFILE path below is safe in both cases and
# no longer fails with "COPY tareq/: not found".
[build]
builder = "DOCKERFILE"
dockerfilePath = "tareq/Dockerfile"
watchPatterns = ["tareq/**"]

[deploy]
# Idempotent: syncs the schema (no-op when in sync) and seeds budget, sub-agents,
# schedules and the owner only when missing. Runs in the built image.
preDeployCommand = "npx prisma db push --skip-generate && node dist/scripts/bootstrap.js"
startCommand = "node dist/src/app/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
